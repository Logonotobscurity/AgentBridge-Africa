name: eval

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests
        run: PYTHONPATH=. python -m pytest -q
      - name: Golden trajectories
        run: make eval
      - name: Server card present
        run: python -c "import json; json.load(open('.well-known/mcp.json'))"
